# ──────────────────────────────────────────────────────────────────────
# Blueprint: OSRS Low HP Alert
# ──────────────────────────────────────────────────────────────────────
# Triggers when a player's HP drops below a configurable threshold.
# Optionally flashes a smart light for a physical alert.
# ──────────────────────────────────────────────────────────────────────

blueprint:
  name: "OSRS Low HP Alert"
  description: >
    Alert when a player's health drops below a threshold.
    Supports mobile notifications and optional smart-light flashing.
  domain: automation
  input:
    health_sensor:
      name: Health Sensor
      description: "The OSRS health sensor (e.g. sensor.osrs_playerone_health)"
      selector:
        entity:
          integration: osrs_data
          domain: sensor
    hp_threshold:
      name: HP Threshold
      description: "Alert when HP falls below this value"
      default: 20
      selector:
        number:
          min: 1
          max: 99
          step: 1
    notify_service:
      name: Notification Service
      description: "The notification service to call"
      default: notify.persistent_notification
      selector:
        text:
    flash_light:
      name: Flash Light (optional)
      description: "A light entity to flash red on low HP. Leave empty to skip."
      default: {}
      selector:
        entity:
          domain: light

trigger:
  - platform: numeric_state
    entity_id: !input health_sensor
    below: !input hp_threshold

action:
  - service: !input notify_service
    data:
      title: "⚠️ OSRS Low HP!"
      message: >-
        HP is {{ state_attr(trigger.entity_id, 'current') }} /
        {{ state_attr(trigger.entity_id, 'max') }}!
        Eat something!
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ flash_light is defined and flash_light | length > 0 }}"
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input flash_light
            data:
              color_name: red
              brightness: 255
              flash: long
